# Checks the backend and the frontend automatically on every push to main and on every pull request
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # Values the backend needs at startup
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Test values for GitHub Actions only, not the real keys
      JWT_SECRET: ci-test-secret-only-for-github-actions-1234567890
      INGEST_API_KEY: ci-test-key

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install packages
        run: pip install -r backend/requirements.txt

      - name: Ruff (check code)
        run: ruff check backend migrations

      - name: Pytest with coverage (run tests)
        working-directory: backend
        run: pytest -v --cov=. --cov-report=term-missing --cov-fail-under=80

      - name: Build Docker image
        run: docker build -t albaniasat-api backend

  # Checks that the website can be built (only the build, no lint for now)
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install packages
        working-directory: frontend
        run: npm install

      - name: Build the frontend
        working-directory: frontend
        run: npm run build